[package]
name        = "filenymous"
version     = "0.2.5"
edition     = "2021"
description = "Filenymous – P2P encrypted file transfer powered by Holochain"
authors     = ["Filenymous Contributors"]

[profile.release]
opt-level = "z"
lto       = true

# ── Build ─────────────────────────────────────────────────────────────────────
[build-dependencies]
tauri-build    = { version = "1.5", features = [] }
toml           = "0.8"

# ── Runtime deps ──────────────────────────────────────────────────────────────
# ── Holochain 0.6.1 ──────────────────────────────────────────────────────────
# `holochain` est lancé en sidecar (bins/holochain-v<version>) ; on ne dépend
# donc que des crates d'API/de types, pas du conductor lui-même.
# build.rs lit la version de `holochain_conductor_api` pour nommer le sidecar :
# elle doit correspondre au binaire holochain embarqué.
[dependencies]
holochain_client        = "0.8.1"
holochain_conductor_api = "0.6.1"
holochain_types         = "0.6.1"
holochain_zome_types    = "0.6.1"
lair_keystore_api       = "0.6.3"

# ── Tauri ──────────────────────────────────────────────────────────────────────
tauri = { version = "1.8", features = [
  "devtools",
  "cli",
  "clipboard-write-text",
  "dialog",
  "process-command-api",
  "system-tray",
  "shell-open",
] }

# ── Async ─────────────────────────────────────────────────────────────────────
futures = "0.3"
tokio   = { version = "1", features = ["time", "macros", "rt-multi-thread", "sync", "process", "io-util"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
bytes      = "1"
env_logger = "0.11"
log        = "0.4"
portpicker = "0.1"
rand       = "0.8"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sodoken    = "0.1"
thiserror  = "1"
url        = "2"
url2       = "0.0.6"

# ── Feature flags ─────────────────────────────────────────────────────────────
[features]
# Required by Tauri for production builds (when distDir points to filesystem)
custom-protocol = ["tauri/custom-protocol"]

[workspace]
