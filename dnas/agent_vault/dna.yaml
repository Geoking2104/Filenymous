---
manifest_version: "0"
name: agent_vault
integrity:
  # Separate network from filenymous-mainnet-v3: this DNA only holds PRIVATE
  # entries (nothing is published but actions), so it never forks the main
  # Filenymous DHT. Change the seed to create an isolated staging network.
  network_seed: "filenymous-agent-vault-v1"
  properties: ~
  zomes:
    - name: agent_vault_integrity
      path: "../../target/wasm32-unknown-unknown/release/agent_vault_integrity.wasm"
coordinator:
  zomes:
    - name: agent_vault
      path: "../../target/wasm32-unknown-unknown/release/agent_vault.wasm"
      dependencies:
        - name: agent_vault_integrity
