# Canal de signalement: never log these requests (no IP in access logs).
# Must come before the generic /filenymous-signal/ location.
location /filenymous-signal/api/v1/reports/ {
    access_log off;
    error_log /var/log/nginx/filenymous-reports-error.log crit;
    client_max_body_size 13m;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location = /filenymous-signal {
    return 301 /filenymous-signal/;
}

location /filenymous-signal/ {
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The server pings every 25 s; long timeouts let a sender keep its tab open.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
