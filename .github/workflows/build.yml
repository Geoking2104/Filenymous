name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # onnxruntime-node (via @huggingface/transformers) tries to download a CUDA
  # build on linux-x64 during `npm ci`; that asset now 404s. CPU only is enough.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # ── Rust / Holochain DNA ────────────────────────────────────────────────────
  rust:
    name: Rust & DNA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Install Holochain toolchain (via Nix)
        run: |
          nix develop -L --command bash -lc '
            set -euo pipefail
            holochain --version
            hc --version
            # DNAs/hApps must be packed by the same major as the 0.6.1 runtime.
            hc --version | grep -Eq " 0\.6\." || { echo "hc must be 0.6.x"; exit 1; }
            holochain --version | grep -Eq " 0\.6\." || { echo "holochain must be 0.6.x"; exit 1; }
            cargo --version
            rustc --version
            node --version
            make --version | head -n 1
          '

      - name: Check network seed consistency (DNA vs desktop)
        run: |
          dna=$(sed -n 's/^ *network_seed: *"\(.*\)".*/\1/p' dnas/filenymous/dna.yaml)
          desk=$(sed -n 's/.*DEFAULT_NETWORK_SEED.*Some("\(.*\)").*/\1/p' src-tauri/src/config.rs)
          echo "dna.yaml=$dna src-tauri=$desk"
          test -n "$dna" && test "$dna" = "$desk"

      - name: Check Rust formatting
        run: nix develop -L --command cargo fmt --all -- --check

      - name: Check WASM workspace
        run: nix develop -L --command cargo check --workspace --target wasm32-unknown-unknown --message-format short

      - name: Compile WASM zomes
        run: nix develop -L --command make build-wasm

      - name: Pack DNA
        run: nix develop -L --command make build-dna

      - name: Pack hApp
        run: nix develop -L --command make build-happ

      - name: Upload hApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: filenymous-happ
          path: |
            workdir/filenymous.happ
            workdir/filenymous-agent-vault.happ
          retention-days: 7

  # Holochain 0.6 replaces JS Tryorama with Rust Sweettest.
  # Keep the browser-only transfer path covered while Sweettest migration is planned.
  desktop:
    name: Desktop (src-tauri, Holochain 0.6.1)
    # Tauri 1 needs webkit2gtk-4.0 (libsoup2), available on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev libssl-dev pkg-config

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Holochain 0.6.1 sidecar (official release)
        run: bash scripts/download-binaries.sh x86_64-unknown-linux-gnu

      - name: hApps from the Rust & DNA job
        uses: actions/download-artifact@v4
        with:
          name: filenymous-happ
          path: pouch

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Cargo check (all targets)
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: First launch against a real conductor (installs both hApps, signs zome calls)
        working-directory: src-tauri
        env:
          HOLOCHAIN_BIN: ${{ github.workspace }}/src-tauri/bins/holochain-v0.6.1-x86_64-unknown-linux-gnu
          FILENYMOUS_POUCH_DIR: ${{ github.workspace }}/pouch
        run: |
          ls -la "$FILENYMOUS_POUCH_DIR"
          cargo test --locked -- --nocapture 2>&1 | tee test.log
          # The conductor test skips itself when the env is missing: fail loudly instead.
          ! grep -q "test ignoré" test.log

  web-tests:
    name: Web/P2P tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install signaling relay dependencies
        run: npm ci
        working-directory: p2p-signal

      - name: Run standalone web tests
        run: >
          npx vitest run
          src/p2p_direct.test.ts
          src/p2p_signal_relay.test.ts
          src/p2p_signal_hardening.test.ts
          src/p2p_signal_server.test.ts
          src/static_room_demo.test.ts
          src/web_mode_standalone.test.ts
        working-directory: tests

  ui-typecheck:
    name: UI typecheck + build + wall tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Placeholder guard (catches truncated pushes)
        run: |
          if grep -rnE "FULL_[A-Z_]*CONTENT_HERE|full (original )?(file )?content continues" src; then echo "::error::placeholder content found"; exit 1; fi
          for f in src/i18n/locales/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
        working-directory: ui
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: ui
      - name: Build (base /app/)
        run: npm run build -- --base=/app/
        working-directory: ui
      - name: Wall, home and SEO unit tests
        run: npx vitest run src/wall/ src/home/ src/safe/ src/i18n/copy.test.ts src/seo.test.ts src/p2p/ src/holochain/runtime.test.ts
        working-directory: ui

  cli-tests:
    name: CLI (filenymous) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install relay dependencies
        run: npm ci
        working-directory: p2p-signal
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli
      - name: Typecheck
        run: npm run typecheck
        working-directory: cli
      - name: Unit + CLI⇄CLI loopback over a local relay
        run: npm test
        working-directory: cli

  extension-tests:
    name: Browser extension (Chrome / Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install relay dependencies
        run: npm ci
        working-directory: p2p-signal
      - name: Install extension dependencies
        run: npm ci
        working-directory: extension
      - name: Typecheck
        run: npm run typecheck
        working-directory: extension
      - name: Unit tests (crypto/link compatibility with the web app) + build
        run: npm test
        working-directory: extension
      - name: Firefox lint (web-ext)
        run: npx -y web-ext@8 lint -s dist/firefox
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: filenymous-extension-zips
          path: extension/dist/*.zip

  # ── UI single-file HTML → ui.zip ─────────────────────────────────────────────
  # L'UI est filenymous-app.html (standalone, pas de build step Vite).
  # Holochain Launcher + Holo Host attendent index.html à la racine du zip.
  ui:
    name: UI zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package single-file HTML as ui.zip
        run: |
          mkdir -p workdir
          cp filenymous-app.html /tmp/index.html
          cd /tmp && zip -j $GITHUB_WORKSPACE/workdir/ui.zip index.html
          echo "ui.zip: $(wc -c < $GITHUB_WORKSPACE/workdir/ui.zip) bytes"

      - name: Upload UI zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: filenymous-ui-zip
          path: workdir/ui.zip
          retention-days: 7

  # ── .webhapp bundle (M4) ─────────────────────────────────────────────────────
  webhapp:
    name: .webhapp bundle
    needs: [rust, ui]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: cachix/cachix-action@v14
        with:
          name: holochain-ci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Download hApp artifact
        uses: actions/download-artifact@v4
        with:
          name: filenymous-happ
          path: workdir

      - name: Download UI zip artifact
        uses: actions/download-artifact@v4
        with:
          name: filenymous-ui-zip
          path: workdir

      - name: Pack .webhapp
        run: nix develop --command hc web-app pack . -o workdir/filenymous.webhapp

      - name: Upload .webhapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: filenymous-webhapp
          path: workdir/filenymous.webhapp
          retention-days: 7
