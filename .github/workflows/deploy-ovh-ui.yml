name: Deploy UI → OVH (filenymous.eu/app)

# Manual only. Builds ui/ with base /app/ (plus web-root .htaccess, robots.txt,
# sitemap.xml, llms.txt, llms-full.txt) and uploads it over SFTP with a
# per-file backup (<remote>.bak-<timestamp>/) via scripts/deploy-ovh-sftp.mjs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        default: "main"
        required: true
      backup:
        description: "per-file backups of overwritten app files (disable on a tight quota; roll back by redeploying the previous SHA)"
        type: boolean
        default: true

concurrency:
  group: deploy-ovh-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build UI (base /app/)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/app/
          ls -la dist dist/assets | head -30
      - name: Install deploy dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Upload to OVH over SFTP (--merge backup)
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
        run: node scripts/deploy-ovh-sftp.mjs --dist ui/dist --remote /home/filenyb/www/app --merge ${{ inputs.backup == false && '--no-backup' || '' }}
      - name: Prune stale assets (keeps this build + files changed in the last 7 days)
        # Merge deploys never delete, so old hashed chunks pile up and fill the quota.
        # Aborts without deleting if the live pages reference anything not in this build.
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
        run: node scripts/ovh-prune-assets.mjs --mode apply --keep-dist ui/dist --grace-days 7
      - name: Upload web-root files (.htaccess, robots.txt, sitemap.xml, llms.txt, llms-full.txt; --merge backup)
        # robots/sitemap/llms files are generated by ui/seo/vite-plugin.mjs into
        # ui/dist-root/; .htaccess comes from deploy/ovh-root/. --merge only
        # overwrites these five files (each backed up first into
        # /home/filenyb/www.bak-<ts>/); app/ and everything else are untouched.
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
        run: |
          cp deploy/ovh-root/.htaccess ui/dist-root/.htaccess
          ls -la ui/dist-root
          test "$(ls -A ui/dist-root | wc -l)" -eq 5
          node scripts/deploy-ovh-sftp.mjs --dist ui/dist-root --remote /home/filenyb/www --merge
