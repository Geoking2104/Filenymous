name: OVH root .htaccess (inspect / apply / rollback)

# Manual only. inspect: downloads the root and /app .htaccess read-only and
# uploads them as an artifact ENCRYPTED to the X.509 certificate given as input
# (the repo is public, so plaintext never reaches logs or artifacts).
# apply: backs up the root .htaccess to .htaccess.bak-<ts>, uploads
# deploy/ovh-root/.htaccess, then checks redirects with curl (incl. port 80).
# rollback: restores a given backup. verify: curl checks only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | apply | rollback | verify"
        required: true
        default: inspect
      cert_b64:
        description: "inspect: base64 PEM certificate to encrypt the artifact to"
        required: false
      backup:
        description: "rollback: /home/filenyb/www/.htaccess.bak-<ts>"
        required: false

concurrency:
  group: deploy-ovh-ui
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deploy dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Inspect (encrypted artifact)
        if: inputs.mode == 'inspect'
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
          CERT_B64: ${{ inputs.cert_b64 }}
        run: |
          test -n "$CERT_B64"
          node scripts/ovh-htaccess.mjs inspect --out "$RUNNER_TEMP/inspect"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/rcpt.pem"
          tar -C "$RUNNER_TEMP/inspect" -cf "$RUNNER_TEMP/inspect.tar" .
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/inspect.tar" -outform DER -out inspect.tar.cms "$RUNNER_TEMP/rcpt.pem"
          rm -rf "$RUNNER_TEMP/inspect" "$RUNNER_TEMP/inspect.tar"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'inspect'
        with:
          name: htaccess-inspect-encrypted
          path: inspect.tar.cms
          retention-days: 1
      - name: Apply deploy/ovh-root/.htaccess (with backup)
        if: inputs.mode == 'apply'
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
        run: node scripts/ovh-htaccess.mjs apply --file deploy/ovh-root/.htaccess
      - name: Rollback
        if: inputs.mode == 'rollback'
        env:
          OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
          BACKUP: ${{ inputs.backup }}
        run: node scripts/ovh-htaccess.mjs rollback --backup "$BACKUP"
      - name: Verify redirects (curl from the runner, incl. http/80)
        if: inputs.mode != 'inspect'
        run: |
          sleep 5
          fail=0
          check() { # url expected_code expected_location
            got=$(curl -s -o /dev/null -m 20 -w '%{http_code} %header{location}' "$1")
            printf '%-52s %s\n' "$1" "$got"
            [ "$got" = "$2 $3" ] || [ "$got" = "$2 " -a -z "$3" ] || { echo "  ^ expected: $2 $3"; fail=1; }
          }
          check 'https://filenymous.eu/app/' 200
          check 'https://filenymous.eu/app/?x=1' 200
          check 'https://filenymous.eu/app/faq/' 200
          check 'https://filenymous.eu/app/en/features/one-time-secret/' 200
          check 'https://filenymous.eu/robots.txt' 200
          check 'https://filenymous.eu/sitemap.xml' 200
          check 'https://filenymous.eu/llms.txt' 200
          check 'https://filenymous.eu/' 301 'https://filenymous.eu/app/'
          check 'https://filenymous.eu/?x=1' 301 'https://filenymous.eu/app/?x=1'
          check 'https://filenymous.eu/index.html' 301 'https://filenymous.eu/app/'
          check 'https://filenymous.eu/app' 301 'https://filenymous.eu/app/'
          check 'https://filenymous.eu/app?x=1' 301 'https://filenymous.eu/app/?x=1'
          check 'https://filenymous.eu/app/faq' 301 'https://filenymous.eu/app/faq/'
          check 'https://www.filenymous.eu/app/?x=1' 301 'https://filenymous.eu/app/?x=1'
          check 'https://www.filenymous.eu/' 301 'https://filenymous.eu/app/'
          check 'https://www.filenymous.eu/app/faq/' 301 'https://filenymous.eu/app/faq/'
          check 'https://www.filenymous.eu/robots.txt' 301 'https://filenymous.eu/robots.txt'
          check 'http://filenymous.eu/' 301 'https://filenymous.eu/app/'
          check 'http://filenymous.eu/app/?x=1' 301 'https://filenymous.eu/app/?x=1'
          check 'http://www.filenymous.eu/app/?x=1&y=a%20b' 301 'https://filenymous.eu/app/?x=1&y=a%20b'
          check 'http://www.filenymous.eu/robots.txt' 301 'https://filenymous.eu/robots.txt'
          echo "== full chain (http://www -> final)"
          curl -sIL -m 30 -o /dev/null -w '%{num_redirects} redirects, final %{http_code} %{url_effective}\n' 'http://www.filenymous.eu/app/?x=1'
          if [ "$fail" != 0 ]; then
            if [ "${{ inputs.mode }}" = verify ]; then echo "::warning::some checks differ from the canonical target"; else echo "::error::redirect checks failed"; exit 1; fi
          fi
